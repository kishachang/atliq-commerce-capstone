version: 2

models:

  - name: dim_customer
    description: "One row per customer."
    columns:

      - name: customer_id
        data_tests:
          - unique
          - not_null


  - name: dim_product
    description: "One row per product enriched with supplier cost."
    columns:

      - name: product_id
        data_tests:
          - unique
          - not_null

      - name: supplier_cost
        data_tests:
          - not_null


  - name: dim_date
    description: "Calendar dimension from 2024-01-01 to 2026-12-31."
    columns:

      - name: date_day
        data_tests:
          - unique
          - not_null


  - name: fact_sales
    description: "Sales fact table at one row per order item."
    columns:

      - name: order_item_id
        data_tests:
          - unique
          - not_null

      - name: order_id
        data_tests:
          - not_null

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id

      - name: order_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Placed
                  - Shipped
                  - Delivered
                  - Cancelled
                  - Returned